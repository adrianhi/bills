name: Quality

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bills_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bills_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bills_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bills_test?schema=public
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run check:architecture
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run lint --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
