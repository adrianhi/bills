name: Daily Database Logical Backup

on:
  schedule:
    # 07:00 UTC = 03:00 AM AST (Hora República Dominicana)
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup PostgreSQL Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Execute Logical Backup
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup-database.js

      - name: Upload Encrypted Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuadre-db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
