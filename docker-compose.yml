x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bills_db?schema=public}
  DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/bills_db?schema=public}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
  APP_URL: ${APP_URL:-http://localhost:3000}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
  LEGACY_OWNER_EMAIL: ${LEGACY_OWNER_EMAIL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  RESEND_RECEIVING_DOMAIN: ${RESEND_RECEIVING_DOMAIN:-}
  INGESTION_ENCRYPTION_KEY: ${INGESTION_ENCRYPTION_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: bills_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bills_db
    ports:
      - "5432:5432"
    volumes:
      - bills_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bills_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
    command: ["sh", "-c", "cd apps/api && npx prisma migrate deploy"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
    container_name: bills_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
    container_name: bills_worker
    command: ["node", "apps/api/dist/worker.js"]
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Legacy personal workflow. The SaaS path is Resend -> signed webhook -> worker.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: bills_n8n
    profiles: ["legacy-n8n"]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Santo_Domingo
      TZ: America/Santo_Domingo
    volumes:
      - bills_n8n_data:/home/node/.n8n

volumes:
  bills_postgres_data:
  bills_n8n_data:
