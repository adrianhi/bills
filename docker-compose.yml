x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bills_db?schema=public}
  DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/bills_db?schema=public}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
  APP_URL: ${APP_URL:-http://localhost:3000}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
  LEGACY_OWNER_EMAIL: ${LEGACY_OWNER_EMAIL:-}
  INGESTION_ENCRYPTION_KEY: ${INGESTION_ENCRYPTION_KEY:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  GOOGLE_PUBSUB_TOPIC: ${GOOGLE_PUBSUB_TOPIC:-}
  GOOGLE_PUBSUB_PUSH_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_AUDIENCE:-}
  GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT: ${GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT:-}
  GMAIL_RECONCILE_INTERVAL_MINUTES: ${GMAIL_RECONCILE_INTERVAL_MINUTES:-5}
  GMAIL_WATCH_RENEWAL_HOURS: ${GMAIL_WATCH_RENEWAL_HOURS:-24}
  GMAIL_SYNC_CONCURRENCY: ${GMAIL_SYNC_CONCURRENCY:-4}
  GMAIL_INITIAL_SYNC_MONTHS: ${GMAIL_INITIAL_SYNC_MONTHS:-2}
  GMAIL_BACKFILL_CONCURRENCY: ${GMAIL_BACKFILL_CONCURRENCY:-2}

services:
  postgres:
    image: postgres:16-alpine
    container_name: bills_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bills_db
    ports:
      - "5432:5432"
    volumes:
      - bills_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bills_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: bills_postgres_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bills_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bills_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
    command: ["sh", "-c", "cd apps/api && npx prisma migrate deploy"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
    container_name: bills_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *app-environment
      PROCESS_ROLE: all
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Legacy personal workflow. The SaaS path is Gmail OAuth -> durable PostgreSQL jobs.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: bills_n8n
    profiles: ["legacy-n8n"]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Santo_Domingo
      TZ: America/Santo_Domingo
    volumes:
      - bills_n8n_data:/home/node/.n8n

volumes:
  bills_postgres_data:
  bills_n8n_data:
